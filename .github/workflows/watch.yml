name: Estonia slot watcher
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a TEST alert only (no site check)"
        type: boolean
        default: false
concurrency:
  group: watch
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright requests
      - run: python check.py
        env:
          TEST_ALERT: ${{ github.event.inputs.test }}
          KEYWORD: ${{ vars.KEYWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          WA_TO: ${{ secrets.WA_TO }}
          TWILIO_WA_FROM: ${{ secrets.TWILIO_WA_FROM }}
